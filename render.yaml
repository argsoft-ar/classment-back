services:
  - type: web
    name: classment-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npx prisma db seed && npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: classment-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: ALLOW_DEMO_SEED
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: BCRYPT_ROUNDS
        value: 12
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: classment-db
    plan: free
    databaseName: classment
    user: classment
